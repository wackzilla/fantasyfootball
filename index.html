<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Contest Standings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 id="league-name">League Name</h1>
    <p class="subtitle">Weekly DraftKings Contest — Results &amp; Standings</p>
  </header>

  <div id="banner" class="banner" hidden>
    <a id="banner-link" href="#" target="_blank" rel="noopener">
      <span id="banner-text"></span>
      <span class="banner-arrow">&rarr;</span>
    </a>
  </div>

  <main>
    <section class="standings-section">
      <h2>Season Standings</h2>
     <p class="legend">
  Each cell shows the place a coach finished that week.<br>
  🥇 1st = 5 pts &middot; 🥈 2nd = 3 pts &middot; 🥉 3rd = 1 pt
</p>
      <div class="table-scroll">
        <table id="standings-table">
          <thead id="standings-head"></thead>
          <tbody id="standings-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Updated weekly by: Big Z</p>
  </footer>

  <script>
    // Cache-busting: appends a changing number to data.js's URL so
    // browsers (especially on phones) always fetch the latest version
    // instead of showing an old cached copy after you edit it.
    document.write('<script src="data.js?v=' + Date.now() + '"><' + '/script>');
  </script>
  <script src="script.js"></script>
</body>
</html>
