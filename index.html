<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Contest Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 id="league-name">Viva la Fútbol</h1>
    <div class="title-flourish" aria-hidden="true"></div>
    <p class="subtitle">¡Vámonos! Fútbol season is here.</p>
  </header>

  <div id="banner" class="banner" hidden>
    <a id="banner-link" href="#" target="_blank" rel="noopener">
      <span id="banner-text"></span>
      <span class="banner-arrow">&rarr;</span>
    </a>
  </div>

  <main>
    <section id="podium-section" class="podium-section" hidden>
      <div class="podium-header">
        <h2>This Week's Podium</h2>
        <span id="podium-week-label" class="podium-week-label"></span>
      </div>
      <div class="podium" id="podium"></div>
    </section>

    <section id="commish-section" class="commish-section" hidden>
      <h2>A Message from the Commish</h2>
      <div class="terminal"><span id="commish-message" class="terminal-text"></span><span class="cursor">&#9608;</span></div>
    </section>

    <div class="standings-layout">
      <aside id="photo-panel" class="photo-panel" hidden>
        <div class="leader-block">
          <div class="leader-badge">
            <svg class="wreath-icon" viewBox="0 0 120 55" aria-hidden="true">
              <g fill="currentColor">
                <ellipse cx="50" cy="50" rx="9" ry="4" transform="rotate(-15 50 50)"/>
                <ellipse cx="41" cy="39" rx="9" ry="4" transform="rotate(-32 41 39)"/>
                <ellipse cx="33" cy="28" rx="9" ry="4" transform="rotate(-50 33 28)"/>
                <ellipse cx="26" cy="18" rx="8" ry="3.5" transform="rotate(-68 26 18)"/>
                <ellipse cx="20" cy="10" rx="7" ry="3" transform="rotate(-85 20 10)"/>
              </g>
              <g fill="currentColor" transform="scale(-1,1) translate(-120,0)">
                <ellipse cx="50" cy="50" rx="9" ry="4" transform="rotate(-15 50 50)"/>
                <ellipse cx="41" cy="39" rx="9" ry="4" transform="rotate(-32 41 39)"/>
                <ellipse cx="33" cy="28" rx="9" ry="4" transform="rotate(-50 33 28)"/>
                <ellipse cx="26" cy="18" rx="8" ry="3.5" transform="rotate(-68 26 18)"/>
                <ellipse cx="20" cy="10" rx="7" ry="3" transform="rotate(-85 20 10)"/>
              </g>
            </svg>
            <span class="leader-label">Current Leader</span>
          </div>
          <div id="leader-name" class="leader-name"></div>
        </div>
        <img id="team-photo" src="" alt="">
      </aside>
      <section class="standings-section">
        <h2>Season Standings</h2>
        <p class="legend">
          Each cell shows the place a coach finished that week.<br>
          🥇 1st = 5 pts &middot; 🥈 2nd = 3 pts &middot; 🥉 3rd = 1 pt
        </p>
        <div class="table-scroll">
          <table id="standings-table">
            <thead id="standings-head"></thead>
            <tbody id="standings-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>Updated weekly by: Big Z</p>
  </footer>

  <script>
    // Cache-busting: appends a changing number to data.js's URL so
    // browsers (especially on phones) always fetch the latest version
    // instead of showing an old cached copy after you edit it.
    document.write('<script src="data.js?v=' + Date.now() + '"><' + '/script>');
  </script>
  <script src="script.js"></script>
</body>
</html>
